name: lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repos.json
        run: jq empty repos.json && jq -e '.repos | length > 0' repos.json
      - name: ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck -S warning bootstrap.sh uninstall.sh audit.sh tests/lib/assert.sh tests/test_receipt.sh tests/test_uninstall.sh
      - name: Unit tests
        run: bash tests/test_receipt.sh && bash tests/test_uninstall.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # -Path takes a single String, so analyze each script and combine results.
          $r = @('bootstrap.ps1','uninstall.ps1','audit.ps1') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error }
          if ($r) { $r | Format-Table; exit 1 }
      - name: audit.ps1 is read-only
        # audit.ps1 is handed to a departing consultant and run on a machine we
        # do not control, so its "writes nothing" promise is enforced in CI.
        run: python3 tests/audit_readonly_check.py
